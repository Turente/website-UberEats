<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/flexboxgrid2@7.2.1/flexboxgrid2.min.css">
    <link rel="stylesheet" href="main.css">
    <title>Uber Eats</title>
</head>


<body>

    <header class="site-header">
        <section class="container">
            <div class="row">

                <div class="logo">
                    <a href="#!">
                        <img src="../img/logo.png" alt="UBER EATS">
                    </a>
                </div>

                <nav class="menu">
                    <ul>
                        <li><button class="button"><b>Войти</b></button></li>
                        <li class="basket"><a href="#!"><img src="../img/basket.svg"></a></li>
                    </ul>
                </nav>

            </div>
        </section>
    </header>
    
    <main class="main">
        <section class="main__restaurant">
            <div class="container">
                <div class="row">
                    <div class="main__restaurant__name col-xl-5">
                        <h1 class="main__restaurant__name_title">Трактир «Пушкин»</h1>
                        <ul class="main__restaurant__name_descaption">
                            <li class="main__restaurant__name_descaption_price">₽₽₽ • Европейская</li>
                            <li class="main__restaurant__name_descaption_time">40 - 50 мин</li>
                        </ul>

                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
